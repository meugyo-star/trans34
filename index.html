function save(){try{localStorage.setItem(key(),JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function grade(q,raw){if(lang!=="ko")return gradeForeign(q,raw);const a=raw.normalize('NFKC').toLowerCase().trim().replace(/\s+/g,' ');const compact=a.replace(/\s+/g,'');let matches=q.parts.map(p=>{let r=new RegExp(p.re,'iu');return r.test(a)||(!['I','I’m','am I?'].includes(p.en)&&r.test(compact))}); // subject omissions can be natural when the predicate is otherwise clear
const subject=q.parts.findIndex(p=>['I','I’m','am I?'].includes(p.en));if(subject>=0&&!matches[subject]&&matches.filter(Boolean).length===matches.length-1&&/(?:야|이에요|예요|입니다|이다|한다|해요|했다|했어|봤어|거야|거예요|것이다|겠다|할래|누구일까|누구야|사용할|쓸\s*거|사용해|쓸게|담당해|맡고|맡았|책임지고|담당하고|돌봤|돌보았)/.test(a))matches[subject]=true;
let score=q.parts.reduce((s,p,i)=>s+(matches[i]?p.p:0),0);let notes=[]; // explicit reversals: retain vocabulary credit but cap semantic accuracy
if(/(?:않[아았는]|않다|않을|안\s*(?:놀|쓰|쓸|찍|담|사용|훈련|돌보|흥분|맡|담당|진정)|못\s*(?:놀|쓰|쓸|사용|훈련|돌보|찍|담|진정)|아니(?:야|다|라고|었|에요|예요)|없다|없을\s*때)/.test(a)){score=Math.min(score,75);notes.push('부정 표현이 원문과 일치하는지 확인하세요.')}
if(q.sentence.startsWith('To capture')&&/(?:드론|무인기).{0,16}(?:사용|이용|쓰|쓸).{0,8}(?:위해|위하여|려고|고자).{0,35}(?:찍|담|촬영|캡처|포착|기록)/.test(a)){score=Math.min(score,75);notes.push('목적과 행동의 관계가 바뀌지 않았는지 확인하세요.')}
if(q.sentence.startsWith('So,')&&/(?:수신호|손.{0,3}신호).{0,15}(?:사용|이용|쓰|쓸).{0,8}(?:위해|위하여|려고).{0,25}(?:진정|안정|달래)/.test(a)){score=Math.min(score,75);notes.push('수신호를 사용하는 목적을 다시 확인하세요.')}
if(q.parts.length>=4&&score===100&&!/(?:다|요|야|어|해|고|며|면|때|기\s*위|려고|것|거|예정|있|했|았|었|겠|할|놀|쓸|맡|인가|까)[.!?\s]*$/.test(a)&&!/(?:위해|려고|할\s*것|할\s*예정|지만|때|하고|했다|한다|있다|해요|거야|입니다|피터야|제니퍼야|감독인|담당하고)/.test(a)){score=Math.min(score,90);notes.push('단어 뜻뿐 아니라 문장 전체의 관계도 표현해 보세요.')}
return {score,matches,notes,hints:state.items[state.idx].hints.length};}
function gradeForeign(q,raw){const a=raw.normalize('NFKC').toLowerCase().replace(/ё/g,'е').trim();const clean=a.replace(/\s+/g,'');const matches=q.parts.map(p=>{const pattern=lang==='zh'?p.zr:p.rr;const r=new RegExp(pattern,'iu');return r.test(a)||(lang==='zh'&&r.test(clean))});let notes=[];const total=q.parts.reduce((n,p)=>n+p.p,0);let score=Math.round(100*q.parts.reduce((n,p,i)=>n+(matches[i]?p.p:0),0)/total);const neg=lang==='zh'?/(?:不|没|未)(?:会|要|想|打算|准备|使用|用|玩|训练|照顾|负责|兴奋|是|在|拍|记录|冷静)/:/(?:^|\s)(?:не|никогда не)\s+(?:[а-я]+(?:ать|ить|еть|ет|ют|ал|ала|аю|ую)|буд[а-я]*|собира[а-я]*|отвеч[а-я]*|использ[а-я]*|дрессир[а-я]*|забот[а-я]*|игра[а-я]*|акт[её]р)/iu;if(neg.test(a)){score=Math.min(score,75);notes.push(t('neg'))}return {score,matches,notes,hints:state.items[state.idx].hints.length}}
const translations={

const keys=['reset','intro','answerLabel','placeholder','prev','next','grade','recordTitle','toggle','close','disclaimer','done','average','above','untried','point','hint','count','score','first','best','gradeHints','sentence','firstScore','bestScore','firstHints','allHints','hideModel','showModel','perfect','retry','past','confirm','neg'];
const ko=['전체 초기화','영어를 읽고 아는 만큼 해석하세요. 모르는 표현은 터치하면 뜻이 나타납니다. 단어만 적어도 부분 점수를 받을 수 있어요.','나의 해석','완벽한 문장이 아니어도 괜찮아요. 아는 단어와 표현부터 적어 보세요.','이전 문장','다음 문장','자동 채점','나의 도전 기록','기록 보기','기록 닫기','※ 문장별 규칙 기반 연습용 채점입니다. 모든 번역이나 문맥을 정확하게 판별하지는 못합니다. 실제 성적 산출용이 아닙니다. 입력은 현재 브라우저에만 저장됩니다.','도전한 문장','도전 문장 평균','90점 이상','미도전','점','사용한 힌트 ','개','이번 해석 점수','최초','최고','이번 채점까지 힌트','문장','최초 점수','최고 점수','최초 힌트','전체 힌트','모범 해석 숨기기','모범 해석 보기','모든 채점 요소를 찾았습니다! 자연스러운 문장인지도 확인해 보세요.','주황색 표현의 의미를 다시 확인하고 해석을 수정해 보세요.','과거 시제','현재 언어의 모든 해석과 점수 기록을 지울까요?','부정 표현이 원문과 일치하는지 확인하세요.'];
function t(k){return (lang==='ko'?ko:translations[lang])[keys.indexOf(k)]}function localize(){document.documentElement.lang=lang;for(const k of ['reset','intro','answerLabel','prev','next','grade','recordTitle','disclaimer'])$(k).textContent=t(k);$('answer').placeholder=t('placeholder');$('toggle').textContent=t($('records').classList.contains('hidden')?'toggle':'close');document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang)})}
$('langs').querySelectorAll('button').forEach(b=>b.onclick=()=>{save();lang=b.dataset.lang;try{localStorage.setItem(LANGKEY,lang)}catch(e){}load();localize();render()});
function renderStats(){const done=state.items.filter(x=>x.best!==null),avg=done.length?Math.round(done.reduce((s,x)=>s+x.best,0)/done.length):0;$('stats').innerHTML=`<div class="stat"><small>${t("done")}</small><strong>${done.length}/${DATA.length}</strong></div><div class="stat"><small>${t("average")}</small><strong>${done.length?avg+t('point'):'—'}</strong></div><div class="stat"><small>${t("above")}</small><strong>${done.filter(x=>x.best>=90).length}</strong></div>`;$('nav').innerHTML=DATA.map((q,i)=>`<button class="${i===state.idx?'active':''} ${state.items[i].best>=90?'good':''}" data-i="${i}">${i+1}<small>${state.items[i].best===null?t('untried'):state.items[i].best+t('point')}</small></button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));renderRecords()}
function renderRecords(){$('records').innerHTML='<div style="overflow:auto"><table><thead><tr><th>'+t('sentence')+'</th><th>'+t('firstScore')+'</th><th>'+t('bestScore')+'</th><th>'+t('firstHints')+'</th><th>'+t('allHints')+'</th></tr></thead><tbody>'+state.items.map((x,i)=>`<tr><td>${i+1} · ${DATA[i].who}</td><td>${x.first?.score??'—'}</td><td>${x.best??'—'}</td><td>${x.first?.hints??'—'}</td><td>${x.hints.length}</td></tr>`).join('')+'</tbody></table></div>'}
function renderWords(){const q=DATA[state.idx],x=state.items[state.idx];$('words').innerHTML=q.parts.map((p,i)=>p.en==='past'?'':`<button class="word ${x.last?(x.last.matches[i]?'hit':'miss'):''}" data-p="${i}"><small>${x.hints.includes(i)?esc(p[lang]):'&nbsp;'}</small><span>${esc(p.en)}</span></button>`).join('');$('words').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.p;if(!x.hints.includes(i))x.hints.push(i);save();renderWords();renderStats()});$('hintCount').textContent=t('hint')+x.hints.length+t('count');}
function renderResult(){const x=state.items[state.idx],q=DATA[state.idx],r=x.last;const el=$('result');el.classList.toggle('hidden',!r);if(!r)return;el.innerHTML=`<hr style="border:0;border-top:1px solid #dce5ed;margin:20px 0"><div class="actions"><div><small>${t("score")}</small><div class="score">${r.score}<small style="font-size:18px"> / 100</small></div></div><span class="spacer"></span><div><small>${t("first")} ${x.first.score}${t("point")} · ${t("best")} ${x.best}${t("point")}</small><br><small>${t("gradeHints")} ${r.hints}</small></div></div><div class="bar"><div style="width:${r.score}%"></div></div><div class="details">${q.parts.map((p,i)=>`<span class="chip ${r.matches[i]?'':'no'}">${r.matches[i]?'✓':'·'} ${esc(p.en==='past'?t('past'):p.en)} ${r.matches[i]?'+'+p.p:'0'}${t("point")}</span>`).join('')}</div><p>${r.score===100?t('perfect'):t('retry')}</p>${r.notes.map(n=>'<p class="muted">'+esc(n)+'</p>').join('')}<button id="reveal">${x.reveal?t('hideModel'):t('showModel')}</button>${x.reveal?'<p><b>'+esc(q.models[lang])+'</b></p>':''}`;$('reveal').onclick=()=>{x.reveal=!x.reveal;save();renderResult()}}
function render(){const q=DATA[state.idx],x=state.items[state.idx];$('heading').textContent=`${state.idx+1} / ${DATA.length} · ${q.who}`;$('answer').value=x.text;$('prev').disabled=state.idx===0;$('next').disabled=state.idx===DATA.length-1;$('grade').disabled=!x.text.trim();renderWords();renderResult();renderStats()}
function go(i){state.idx=i;save();render()}
$('answer').oninput=()=>{const x=state.items[state.idx];x.text=$('answer').value;x.last=null;save();$('grade').disabled=!x.text.trim();renderWords();renderResult()};$('grade').onclick=()=>{const x=state.items[state.idx];if(!x.text.trim())return;const r=grade(DATA[state.idx],x.text);x.last=r;if(!x.first)x.first={score:r.score,hints:r.hints};x.best=Math.max(x.best??0,r.score);save();renderResult();renderWords();renderStats()};$('prev').onclick=()=>go(state.idx-1);$('next').onclick=()=>go(state.idx+1);$('toggle').onclick=()=>{$('records').classList.toggle('hidden');$('toggle').textContent=$('records').classList.contains('hidden')?t('toggle'):t('close')};$('reset').onclick=()=>{if(confirm(t('confirm'))){state=fresh();save();render()}};render();
</script></body></html>
